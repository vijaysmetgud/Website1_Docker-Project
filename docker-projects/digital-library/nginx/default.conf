server {
    listen 80;
    server_name localhost;

    # Website
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 🔥 Digital content access
    location /content/ {
        alias /content/;
        autoindex on;
        add_header Cache-Control "no-store";
    }
}
